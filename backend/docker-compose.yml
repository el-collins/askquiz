services:
  api:
    build: .
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql://askquiz:${POSTGRES_PASSWORD}@db:5432/askquiz
      GROQ_API_KEY: ${GROQ_API_KEY}
      DAILY_REQUEST_CAP: ${DAILY_REQUEST_CAP:-50}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: askquiz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: askquiz
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askquiz -d askquiz"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  db_data:
